<!doctype html>
<html lang="ms" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rasaaqita Cafe Operations</title>
    <meta name="description" content="Sistem pemantauan operasi kafe berbilang outlet (KPJ Larkin, KPJ Bandar Dato On, Central Kitchen, Kiosk RnR Gombak) merangkumi pemeriksaan 12 titik kritikal sesi BOS, MOS, dan EOS." />
    <meta property="og:title" content="Rasaaqita Cafe Operations" />
    <meta property="og:description" content="Sistem pemantauan operasi kafe berbilang outlet (KPJ Larkin, KPJ Bandar Dato On, Central Kitchen, Kiosk RnR Gombak) merangkumi pemeriksaan 12 titik kritikal sesi BOS, MOS, dan EOS." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        const theme = localStorage.getItem('rasaaqita_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="h-full bg-stone-50 text-stone-800 dark:bg-stone-950 dark:text-stone-100 antialiased font-sans transition-colors duration-200">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
